[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software"
version = "0.1.0"
description = "Multifrontal LU software-side prototype"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[tool.pytest.ini_options]
addopts = "-q"