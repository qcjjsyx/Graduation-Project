<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="420" viewBox="0 0 1800 420">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1800" height="420" fill="#f8fafc"/>

  <text x="90" y="72" font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"
        font-size="36" font-weight="700" fill="#0f172a">软件侧前处理与硬件输入生成流程</text>

  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif">
    <g transform="translate(70,135)" filter="url(#shadow)">
      <rect width="190" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="58" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">稀疏矩阵</text>
      <text x="95" y="91" text-anchor="middle" font-size="18" fill="#475569">输入数据</text>
    </g>

    <g transform="translate(315,135)" filter="url(#shadow)">
      <rect width="190" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="95" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#0f172a">排序</text>
      <text x="95" y="86" text-anchor="middle" font-size="22" fill="#475569">AMD / RCM</text>
    </g>

    <g transform="translate(560,135)" filter="url(#shadow)">
      <rect width="230" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="115" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">消去树</text>
      <text x="115" y="86" text-anchor="middle" font-size="22" fill="#475569">Supernode</text>
    </g>

    <g transform="translate(845,135)" filter="url(#shadow)">
      <rect width="245" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="122.5" y="50" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Front Indices</text>
      <text x="122.5" y="86" text-anchor="middle" font-size="22" fill="#475569">A_local</text>
    </g>

    <g transform="translate(1145,135)" filter="url(#shadow)">
      <rect width="220" height="118" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <text x="110" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#0f172a">S_format</text>
      <text x="110" y="86" text-anchor="middle" font-size="24" fill="#475569">量化</text>
    </g>

    <g transform="translate(1420,135)" filter="url(#shadow)">
      <rect width="150" height="118" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
      <text x="75" y="68" text-anchor="middle" font-size="30" font-weight="700" fill="#075985">产物</text>
    </g>

    <g transform="translate(1618,135)" filter="url(#shadow)">
      <rect width="150" height="118" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
      <text x="75" y="53" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">硬件所需</text>
      <text x="75" y="88" text-anchor="middle" font-size="26" font-weight="700" fill="#166534">数据</text>
    </g>

    <g stroke="#334155" stroke-width="3.5" fill="none" marker-end="url(#arrow)">
      <path d="M260 194 H303"/>
      <path d="M505 194 H548"/>
      <path d="M790 194 H833"/>
      <path d="M1090 194 H1133"/>
      <path d="M1365 194 H1408"/>
      <path d="M1570 194 H1606"/>
    </g>

    <text x="90" y="330" font-size="22" fill="#334155">
      软件侧负责：符号分析、任务/映射生成、A_local 预量化、DDR 输入数据组织
    </text>
    <text x="90" y="365" font-size="22" fill="#334155">
      硬件侧负责：多源装配、node-scale 选择、整数 LU/TRSM/GEMM 与 update 生成
    </text>
